# Twinkle Server Configuration - MUSA / Transformers Backend
# Adapted for Moore Threads MTT S5000 + torch_musa.
# Original CUDA version backed up as: server_config.yaml.cuda.bak
#
# Minimal path for cookbook/client/twinkle/self_host/self_cognition.py:
#   gateway (server) + model + processor. Sampler disabled (client does not sample).

# proxy_location: determines where the HTTP proxy runs.
# "EveryNode" means each Ray node runs its own proxy (good for multi-node).
proxy_location: EveryNode

# HTTP listener settings
http_options:
  host: 0.0.0.0        # Listen on all network interfaces
  port: 8000            # Port number for the server

# Applications: each entry defines a service component deployed on the server
applications:

  # 1. TinkerCompatServer - The central API server
  #    Handles client connections, training run tracking, checkpoint listing.
  - name: server
    route_prefix: /api/v1          # API endpoint prefix (Tinker-compatible)
    import_path: server            # Python module to import
    args:
      server_config:
        per_token_model_limit: 3      # Maximum number of models (adapters) per token (server-globally enforced)
      supported_models:
        - Qwen/Qwen3.5-4B
    deployments:
      - name: TinkerCompatServer
        max_ongoing_requests: 50
        autoscaling_config:
          min_replicas: 1                # Minimum number of replicas
          max_replicas: 1                # Maximum number of replicas
          target_ongoing_requests: 128   # Target concurrent requests per replica
        ray_actor_options:
          num_cpus: 0.1                  # CPU resources allocated to this actor

  # 2. Model Service - Transformers + LoRA training worker on MUSA
  - name: models-Qwen3.5-4B
    route_prefix: /api/v1/model/Qwen/Qwen3.5-4B
    import_path: model
    args:
      use_megatron: false                          # Use HuggingFace Transformers backend
      # Prefer local weights to avoid re-download (fallback: ms://Qwen/Qwen3.5-4B)
      model_id: "/data/wangmx/Qwen3.5-4B"
      max_length: 10240
      nproc_per_node: 1                            # Single MUSA process for first bring-up
      device_group:
        name: model
        ranks: 1
        device_type: musa                          # Twinkle Platform: MUSA
      device_mesh:
        device_type: musa
        dp_size: 1
      queue_config:
        rps_limit: 100                              # Max requests per second
        tps_limit: 100000                           # Max tokens per second
      adapter_config:
        adapter_timeout: 30                      # Seconds before idle adapter unload
    deployments:
      - name: ModelManagement
        autoscaling_config:
          min_replicas: 1
          max_replicas: 1
          target_ongoing_requests: 16
        ray_actor_options:
          num_cpus: 0.1
          runtime_env:
            env_vars:
              TWINKLE_TRUST_REMOTE_CODE: "0"

  # 3. Sampler Service - DISABLED for self_cognition bring-up
  #    self_cognition.py only trains/saves; re-enable when sampling is needed.
  # - name: sampler-Qwen3.5-4B
  #   route_prefix: /api/v1/sampler/Qwen/Qwen3.5-4B
  #   import_path: sampler
  #   args:
  #     model_id: "/data/wangmx/Qwen3.5-4B"
  #     nproc_per_node: 1
  #     sampler_type: torch
  #     engine_args:
  #       max_model_len: 4096
  #       gpu_memory_utilization: 0.5
  #       enable_lora: true
  #       logprobs_mode: processed_logprobs
  #     device_group:
  #       name: sampler
  #       ranks: 1
  #       device_type: musa
  #     device_mesh:
  #       device_type: musa
  #       dp_size: 1
  #     queue_config:
  #       rps_limit: 100
  #       tps_limit: 100000
  #   deployments:
  #     - name: SamplerManagement
  #       autoscaling_config:
  #         min_replicas: 1
  #         max_replicas: 1
  #         target_ongoing_requests: 16
  #       ray_actor_options:
  #         num_cpus: 0.1
  #         runtime_env:
  #           env_vars:
  #             TWINKLE_TRUST_REMOTE_CODE: "0"

  # 4. Processor Service (CPU) - Dataset / DataLoader remote ops
  - name: processor
    route_prefix: /api/v1/processor
    import_path: processor
    args:
      ncpu_proc_per_node: 2
      device_group:
        name: model
        ranks: 2
        device_type: CPU
      device_mesh:
        device_type: CPU
        dp_size: 2
    deployments:
      - name: ProcessorManagement
        autoscaling_config:
          min_replicas: 1
          max_replicas: 1
          target_ongoing_requests: 128
        ray_actor_options:
          num_cpus: 0.1
